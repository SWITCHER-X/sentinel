<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SENTINEL — Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0f14; --bg-elevated: #111820; --bg-sunken: #080c10;
  --fg: #e8ecf1; --fg-muted: #6b7a8a; --fg-dim: #3d4a5a;
  --accent: #00d4aa; --crit: #ff3b30;
  --border: #1e2a36; --border-strong: #2d3e4e;
  --font-ui: 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  --radius: 4px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-ui); font-size: 12px;
  background: var(--bg); color: var(--fg);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
}
.card {
  width: 340px; padding: 28px;
  background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: var(--radius);
}
.logo { font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.2em;
  color: var(--accent); font-size: 15px; margin-bottom: 4px; }
.sub { color: var(--fg-muted); font-size: 11px; margin-bottom: 22px; }
label { display: block; font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.5px; color: var(--fg-muted); margin: 12px 0 4px; }
input {
  width: 100%; height: 34px; padding: 0 10px;
  background: var(--bg-sunken); border: 1px solid var(--border);
  color: var(--fg); border-radius: var(--radius); font-family: var(--font-mono);
  font-size: 12px;
}
input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0,212,170,0.25); }
button {
  width: 100%; height: 36px; margin-top: 18px;
  background: var(--accent); color: #04211b; border: none; border-radius: var(--radius);
  font-family: var(--font-mono); font-weight: 700; font-size: 11px;
  letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
}
button:hover { filter: brightness(1.1); }
.err { color: var(--crit); font-size: 11px; margin-top: 12px; min-height: 14px; font-family: var(--font-mono); }
.hint { margin-top: 16px; color: var(--fg-dim); font-size: 10px; line-height: 1.5; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">SENTINEL LINEAGE</div>
  <div class="sub">Endpoint detection — authentication required</div>
  <form id="f">
    <label for="u">Username</label>
    <input id="u" autocomplete="username" autofocus>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
    <div class="err" id="e"></div>
  </form>
  <div class="hint">Credentials are set at install time in<br>/etc/sentinel/sentinel.env</div>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const e = document.getElementById('e');
  try {
    const r = await fetch('/api/v1/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('u').value,
        password: document.getElementById('p').value
      })
    });
    if (r.ok) { location.href = '/'; return; }
    const j = await r.json().catch(() => ({}));
    e.textContent = j.error || ('failed: ' + r.status);
  } catch (err) {
    e.textContent = 'connection error';
  }
});
</script>
</body>
</html>
